amily="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#6b7280">5</text><text x="124" y="305" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" xml:space="preserve"><tspan fill="#e5e7eb">auc = </tspan><tspan fill="#60a5fa">score</tspan><tspan fill="#e5e7eb">(model, X_test)  </tspan><tspan fill="#6b7280"># 0.94</tspan></text><text x="86" y="345" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#6b7280">6</text><text x="124" y="345" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" xml:space="preserve"><tspan fill="#e5e7eb">mlflow.</tspan><tspan fill="#60a5fa">log_model</tspan><tspan fill="#e5e7eb">(model, </tspan><tspan fill="#34d399">"churn"</tspan><tspan fill="#e5e7eb">)</tspan></text><text x="810" y="85" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#e5e7eb">Python &amp; ML</text><rect x="810" y="101" width="330" height="12" rx="6" fill="#ffffff" fill-opacity=".08"/><rect x="810" y="101" width="314" height="12" rx="6" fill="#a78bfa"/><text x="810" y="163" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#e5e7eb">LLMs / Deep Learning</text><rect x="810" y="179" width="330" height="12" rx="6" fill="#ffffff" fill-opacity=".08"/><rect x="810" y="179" width="280" height="12" rx="6" fill="#60a5fa"/><text x="810" y="241" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#e5e7eb">Cloud &amp; MLOps</text><rect x="810" y="257" width="330" height="12" rx="6" fill="#ffffff" fill-opacity=".08"/><rect x="810" y="257" width="290" height="12" rx="6" fill="#34d399"/><text x="810" y="319" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#e5e7eb">SQL &amp; Data</text><rect x="810" y="335" width="330" height="12" r