xt-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#e5e7eb">17:04</text><text x="610" y="252" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#a78bfa">FOCUS</text><rect x="790" y="45" width="360" height="145" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/><text x="822" y="95" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#9ca3af">STOPWATCH</text><text x="822" y="160" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" font-weight="700" fill="#60a5fa">01:23:45</text><rect x="790" y="210" width="360" height="145" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/><text x="822" y="258" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#9ca3af">SEARCH</text><rect x="822" y="280" width="296" height="52" rx="26" fill="#0a0820" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2"/><circle cx="852" cy="303" r="10" fill="none" stroke="#a78bfa" stroke-width="3"/><path d="M859 310l9 9" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/><text x="882" y="314" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#9ca3af">focus tips_</text></svg>
